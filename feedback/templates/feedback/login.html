{% extends "feedback/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap card">
  <h1><span class="brand-mark" aria-hidden="true" style="display:inline-block;vertical-align:-3px"></span> Echovance</h1>
  <p class="secondary">Customer feedback intelligence &amp; action management.</p>
  {% if form.errors %}<div class="banner banner-error" role="alert">Username or password is incorrect.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="id_username">Username</label><input type="text" name="username" id="id_username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="id_password">Password</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
