{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn" href="?{% if query %}{{ query }}&{% endif %}page={{ page.previous_page_number }}">← Previous</a>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} items</span>
  {% if page.has_next %}<a class="btn" href="?{% if query %}{{ query }}&{% endif %}page={{ page.next_page_number }}">Next →</a>{% endif %}
</nav>
{% endif %}
